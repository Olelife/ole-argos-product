# config.example.conf — copiá a config.local.conf (gitignored, per-user).
# Solo lo que varía entre máquinas.

# Idioma con el que Argos narra con vos
OLE_CHAT_LANG="es"

# Org de GitHub
OLE_GH_ORG="Olelife"

# Carpetas del cerebro que Producto baja (READ-ONLY, sparse). Solo lo que sirve para el PRD;
# findings/ entra solo lectura: el verbo reconciliar del intake lo cruza con el decision-log. Nada de services/ ni specs/.
OLE_BRAIN_SPARSE="/domain/ /architecture/flows/ /findings/ /glossary.md /README.md"

# RAG (opcional): índice de Bedrock KB del corpus de Producto — sin esto /argos-product:rag avisa "no habilitado"
# RAG_KB_ID="<knowledgeBaseId>"
# RAG_AWS_REGION="us-east-1"
